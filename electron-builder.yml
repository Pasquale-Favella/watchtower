appId: com.favella.watchtower
productName: Watchtower
directories:
  buildResources: build
  output: dist
# Stable, version-less installer names (Watchtower-win-x64.exe, …) so the
# README's releases/latest/download links always resolve to the newest build.
artifactName: ${productName}-${os}-${arch}.${ext}
files:
  - out/**
# Bundled ACP engines (ADR 0016 map 47 ticket 49): codex ships the Codex
# engine and claude-agent-acp ships the Claude Agent SDK as native binaries
# inside per-platform npm packages (@openai/codex-*, @anthropic-ai/
# claude-agent-sdk-*). Child processes spawned with ELECTRON_RUN_AS_NODE
# cannot execute native binaries out of the virtual asar filesystem — unpack
# ONLY those engine packages to real disk. The JS wrappers (codex-acp,
# claude-agent-acp, pi-acp, the SDKs) run from inside the asar, so unpacking
# them is not just wasteful but breaks the mac universal build: @electron/
# universal joins EVERY unpacked file into one glob, and minimatch rejects
# globs over 64KB ("pattern is too long").
asarUnpack:
  - node_modules/@openai/codex-*/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # Universal-merge rule (electron-builder v26, release v0.2.0 failure): the
  # bundled engines' platform-specific packages (@openai/codex-darwin-* and
  # the Claude Agent SDK's @anthropic-ai/claude-agent-sdk-darwin-*) are
  # installed by npm only for the build runner's arch, so they land
  # byte-identical in both the x64 and arm64 halves of the universal build —
  # and the merge hard-fails unless those files are declared arch-neutral.
  # NOTE: the schema wants ONE minimatch string (not a list) — a list fails
  # config validation for every target.
  x64ArchFiles: '**/node_modules/{@openai/codex-darwin-*,@anthropic-ai/claude-agent-sdk-darwin-*}/**'
  category: public.app-category.developer-tools
  # Sign-ready (ADR 0015): electron-builder signs with CSC_LINK/
  # CSC_KEY_PASSWORD when present and skips signing when absent.
  # Notarization is NOT wired: electron-builder requires `notarize: true`
  # (plus APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID secrets) to
  # notarize — env vars alone are ignored. Flip it on when Apple creds exist.
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Pasquale Favella <Pasquale-Favella@users.noreply.github.com>
