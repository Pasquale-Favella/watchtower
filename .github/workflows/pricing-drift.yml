name: pricing-drift

# The bundled LiteLLM price catalog
# (src/main/pipeline/data/litellm-snapshot.json) is a generated artifact —
# `npm run pricing:bundle` rewrites it from upstream. Regenerating it by hand is
# how it drifted in the first place, so the guard is a script
# (`scripts/bundle-litellm.mjs --check`) that fails when the committed file no
# longer matches what upstream would produce, not a human reading a diff.
#
# This is a SEPARATE workflow, not a job in test.yml, for one reason: the check
# needs network access. test.yml is the blocking merge gate and everything in it
# is offline and deterministic; folding a github.com fetch into it would make
# merge-readiness depend on a third party being up. It also means the gate stays
# green while the network is down, instead of blocking every PR.
#
# Being honest about what this buys: a SCHEDULED run cannot block a merge. It
# can only surface drift — a red weekly run that says "upstream moved, run
# `npm run pricing:bundle` and commit the result". The pull_request trigger is
# the part that can actually hold a PR to account, and even that only covers
# PRs that touch the files that carry the contract.

on:
  workflow_dispatch:
  schedule:
    # Weekly, deliberately off the hour: the top of the hour is when every
    # cron-scheduled workflow on GitHub fires at once and gets delayed.
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - scripts/bundle-litellm.mjs
      - src/main/pipeline/data/litellm-snapshot.json
      # The live fetch builds its map with the same direct-beats-re-hoster
      # asymmetry the generator has to mirror (an unconditional write for a
      # DIRECT upstream key, a first-write-wins-guarded write for a
      # provider-prefix-stripped alias). A PR that changed that rule in
      # `models.ts` alone made the offline and online engines disagree about the
      # same model with no check running at all — this filter exists to catch
      # that, not because the file affects the bundle's bytes.
      - src/main/pipeline/models.ts
      - .github/workflows/pricing-drift.yml

jobs:
  drift:
    name: Bundle matches upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exits non-zero when the committed bundle has drifted from upstream, and
      # prints the added/removed/changed key counts so the log says what moved.
      - run: npm run pricing:bundle -- --check
