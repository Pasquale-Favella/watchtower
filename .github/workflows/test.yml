name: test

# One PR workflow owns core checks and selects the relevant application checks.
# Protected main requires PR checks, so merging does not repeat them.
# Releases still call this workflow to verify the exact tagged commit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The prefix keeps this separate from the caller's release concurrency group.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.changes.outputs.checks }}
      runtime: ${{ steps.changes.outputs.runtime }}
      installers: ${{ steps.changes.outputs.installers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify changed files
        id: changes
        run: node scripts/ci-changes.cjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        if: needs.changes.outputs.checks == 'true'
      - run: npm run lint:effect
        if: needs.changes.outputs.checks == 'true'
      - run: npm run format:check

  test:
    name: Typecheck + tests
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test -- --run

  windows-process-regression:
    name: Windows process source regressions
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise Windows process cleanup and command shims
        run: >-
          npm test -- --run
          tests/agents-process-tree.test.ts
          tests/command-runner.test.ts
          tests/command-runner-start.test.ts
          tests/command-runner-fast-exit.test.ts

  application:
    name: Application checks
    needs: [changes, lint, test, windows-process-regression]
    if: >-
      needs.changes.outputs.runtime == 'true' &&
      github.event_name != 'push' &&
      github.event.pull_request.draft != true
    uses: ./.github/workflows/e2e.yml
    with:
      installers: ${{ needs.changes.outputs.installers == 'true' }}
