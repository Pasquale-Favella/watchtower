name: e2e

# Reused by test.yml inside the same PR run. Installer acceptance includes
# packaged-app verification, so these two packaging paths are alternatives.

on:
  workflow_call:
    inputs:
      installers:
        description: Build and verify installers instead of application directories
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/

  packaged:
    if: ${{ !inputs.installers }}
    name: packaged (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package Linux application directory
        if: matrix.platform == 'linux'
        run: npx electron-builder --config electron-builder.config.cjs --linux --dir --publish never
      - name: Package macOS universal application directory
        if: matrix.platform == 'mac'
        run: npx electron-builder --config electron-builder.config.cjs --mac --dir --universal --publish never
      - name: Verify packaged Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/verify-packaged.cjs --executable dist/linux-unpacked/watchtower-desktop
      - name: Verify packaged macOS application
        if: matrix.platform == 'mac'
        run: node scripts/verify-packaged.cjs --executable dist/mac-universal/Watchtower.app/Contents/MacOS/Watchtower

  installers:
    if: inputs.installers
    name: installer acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer artifacts
        run: npm run package:${{ matrix.platform }}
        # Reproduce the release workflow's environment when signing secrets are absent.
        env:
          # Exercise ad-hoc signing on PRs too; this job never receives signing secrets.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''
      - name: Verify installer artifacts
        run: node scripts/verify-installer-artifacts.cjs --platform ${{ matrix.platform }}
