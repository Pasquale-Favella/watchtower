name: e2e

# Playwright Electron end-to-end (tracks #133, built in #134). The general
# navigation suite stays non-blocking while timing stabilises. The packaged
# Linux/macOS acceptance job below is blocking for the platform claim (ADR 0015).
#
# No browser download needed: the specs drive the repo's own Electron binary.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'playwright.config.ts'
      - 'electron-builder.yml'
      - 'electron-builder.config.cjs'
      - 'build/**'
      - 'scripts/verify-packaged.cjs'
      - 'scripts/verify-installer-artifacts.cjs'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'playwright.config.ts'
      - 'electron-builder.yml'
      - 'electron-builder.config.cjs'
      - 'build/**'
      - 'scripts/verify-packaged.cjs'
      - 'scripts/verify-installer-artifacts.cjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits cancel instead of burning two OS runners each:
# a push burst costs ~1 run, not N. Safe here because e2e.yml is never
# called as a reusable workflow (unlike test.yml, see its header).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Drafts are by definition not mergeable — skip them, run on ready PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/

  packaged:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: packaged (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package Linux application directory
        if: matrix.platform == 'linux'
        run: npx electron-builder --config electron-builder.config.cjs --linux --dir --publish never
      - name: Package macOS universal application directory
        if: matrix.platform == 'mac'
        run: npx electron-builder --config electron-builder.config.cjs --mac --dir --universal --publish never
      - name: Verify packaged Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/verify-packaged.cjs --executable dist/linux-unpacked/watchtower-desktop
      - name: Verify packaged macOS application
        if: matrix.platform == 'mac'
        run: node scripts/verify-packaged.cjs --executable dist/mac-universal/Watchtower.app/Contents/MacOS/Watchtower

  installers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: installer acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer artifacts
        run: npm run package:${{ matrix.platform }}
        # Reproduce the release workflow's environment when signing secrets are absent.
        env:
          # Exercise ad-hoc signing on PRs too; this job never receives signing secrets.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''
      - name: Verify installer artifacts
        run: node scripts/verify-installer-artifacts.cjs --platform ${{ matrix.platform }}
