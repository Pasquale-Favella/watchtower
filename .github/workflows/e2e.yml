name: e2e

# Playwright Electron end-to-end (tracks #133, built in #134). Intentionally
# NON-BLOCKING while timing stabilises: the merge gate stays test.yml
# (ADR 0015) — failures here notify without blocking merges. Promote into
# the gate (follow-up #135) once green runs are routine.
#
# No browser download needed: the specs drive the repo's own Electron binary.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# Superseded commits cancel instead of burning two OS runners each:
# a push burst costs ~1 run, not N. Safe here because e2e.yml is never
# called as a reusable workflow (unlike test.yml, see its header).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Drafts are by definition not mergeable — skip them, run on ready PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
