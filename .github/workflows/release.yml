name: release

# Cross-platform release pipeline (ADR 0015). Runs only when a version tag
# (v*) is pushed: re-tests the exact tagged code, builds all three packaging
# targets — Windows NSIS, macOS universal DMG/zip, Linux AppImage/deb — and
# publishes a GitHub Release with every installer attached.
# macOS can only be built on macOS, so the build matrix is the source of truth.

on:
  push:
    tags: ['v*']

# Cancel a superseded run (new tag) instead of burning runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + tests (tagged commit)
    uses: ./.github/workflows/test.yml

  build:
    name: Package ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest
          - target: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package artifacts and update metadata
        run: npm run package:${{ matrix.target }}
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify the release installer artifacts
        run: node scripts/verify-installer-artifacts.cjs --platform ${{ matrix.target }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: watchtower-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only job that writes — attach installers to the tagged release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate release artifacts and update metadata
        run: node scripts/prepare-release-artifacts.cjs artifacts
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
