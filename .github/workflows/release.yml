name: release

# Cross-platform release pipeline (ADR 0015). Runs only when a version tag
# (v*) is pushed: re-tests the exact tagged code, builds all three packaging
# targets — Windows NSIS, macOS universal DMG/zip, Linux AppImage/deb — and
# publishes a GitHub Release with every installer attached.
# macOS can only be built on macOS, so the build matrix is the source of truth.

on:
  push:
    tags: ['v*']

# Cancel a superseded run (new tag) instead of burning runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + tests (tagged commit)
    uses: ./.github/workflows/test.yml

  verify-version:
    # The tag must agree with package.json before any OS runner is spent
    # building. One cheap ubuntu job beats re-running the same comparison
    # inside every leg of the matrix.
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-release-version.cjs

  build:
    name: Package ${{ matrix.target }}
    needs: [test, verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest
          - target: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:${{ matrix.target }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: watchtower-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only job that writes — attach installers to the tagged release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
